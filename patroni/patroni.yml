scope: star_rail_cluster
namespace: /db/
name: postgres_node

restapi:
  listen: 0.0.0.0:8008
  connect_address: 0.0.0.0:8008

etcd3:
  host: etcd:2379

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        wal_level: replica
        hot_standby: "on"
        max_replication_slots: 10
        max_wal_senders: 10
        wal_keep_size: 128MB
  initdb:
    - auth-host: md5
    - auth-local: trust
    - encoding: UTF8
    - data-checksums

  pg_hba:
    - host replication all 0.0.0.0/0 md5
    - host all all 0.0.0.0/0 md5

postgresql:
  listen: 0.0.0.0:5432
  connect_address: 0.0.0.0:5432
  data_dir: /data/patroni
  bin_dir: /usr/lib/postgresql/15/bin
